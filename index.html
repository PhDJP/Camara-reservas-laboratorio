<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Tomar foto del equipo</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { margin: 0; background: #111821; color: #f4f6f8; }
    main { box-sizing: border-box; max-width: 620px; margin: auto; padding: 24px 18px 36px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #c5cfdb; line-height: 1.45; }
    video, img { display: block; width: 100%; max-height: 65vh; aspect-ratio: 4/3; object-fit: contain; background: #05080c; border-radius: 12px; margin: 14px 0; }
    img[hidden], video[hidden], [hidden] { display: none !important; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button { flex: 1 1 190px; min-height: 48px; border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 700; background: #147b71; color: white; }
    button.secondary { background: #283543; }
    button:disabled { opacity: .55; }
    #status { min-height: 1.4em; }
    .error { color: #ffaaa5; }
  </style>
</head>
<body>
  <main>
    <h1>Tomar foto del equipo</h1>
    <p>Usa la cámara para fotografiar el equipo. Esta página no permite elegir imágenes de la galería.</p>
    <video id="video" autoplay playsinline muted hidden></video>
    <img id="preview" alt="Foto capturada" hidden>
    <p id="status" role="status" aria-live="polite">Toca «Activar cámara» y concede permiso cuando el navegador lo solicite.</p>
    <div class="actions">
      <button id="start">Activar cámara</button>
      <button id="capture" hidden>Tomar foto</button>
      <button id="retake" class="secondary" hidden>Tomar otra</button>
      <button id="send" hidden>Usar esta foto</button>
    </div>
  </main>
  <script>
    'use strict';
    // Reemplaza este origen por el origen exacto que muestra location.origin en la app desplegada.
    const ALLOWED_PARENT_ORIGINS = ['https://n-5hzebqksnzvpgj27zydudyde6gl2sdx5c3lu45a-0lu-script.googleusercontent.com'];
    const params = new URLSearchParams(location.search);
    const requestId = params.get('requestId') || '';
    const targetOrigin = params.get('targetOrigin') || '';
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const start = document.getElementById('start');
    const capture = document.getElementById('capture');
    const retake = document.getElementById('retake');
    const send = document.getElementById('send');
    let stream = null, photo = '';

    function stopCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null; video.srcObject = null; video.hidden = true; capture.hidden = true;
    }
    function reportError(message) {
      status.textContent = message; status.className = 'error';
      if (window.opener && requestId && ALLOWED_PARENT_ORIGINS.includes(targetOrigin)) {
        window.opener.postMessage({ type: 'camera-error', requestId, message }, targetOrigin);
      }
    }
    function compressedJpeg(source) {
      let side = 1280, quality = 0.72, data = '';
      for (let i = 0; i < 6; i++) {
        const scale = Math.min(1, side / Math.max(source.width, source.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(source.width * scale));
        canvas.height = Math.max(1, Math.round(source.height * scale));
        const context = canvas.getContext('2d');
        if (!context) throw new Error('No se pudo procesar la foto.');
        context.drawImage(source, 0, 0, canvas.width, canvas.height);
        data = canvas.toDataURL('image/jpeg', quality);
        if (data.length <= 1400000) return data;
        side = Math.round(side * 0.8); quality = Math.max(0.5, quality - 0.06);
      }
      if (data.length > 1400000) throw new Error('La foto pesa demasiado; toma otra con menos detalle.');
      return data;
    }
    async function openCamera() {
      if (!requestId || !window.opener || window.opener.closed) { reportError('Abre esta página desde la aplicación para continuar.'); return; }
      if (!ALLOWED_PARENT_ORIGINS.includes(targetOrigin) || !/^https:\/\//i.test(targetOrigin)) { reportError('El origen de la aplicación no está autorizado en la configuración de esta página.'); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { reportError('Este navegador no permite usar la cámara.'); return; }
      start.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        video.srcObject = stream; video.hidden = false;
        await video.play(); capture.hidden = false; start.hidden = true; status.className = '';
        status.textContent = 'Enfoca el equipo y toma la foto.';
      } catch (error) {
        stopCamera(); start.disabled = false;
        reportError(error && error.name === 'NotAllowedError' ? 'No se concedió permiso para usar la cámara.' : 'No se pudo abrir la cámara. Revisa que esté disponible.');
      }
    }
    start.onclick = openCamera;
    capture.onclick = () => {
      if (!stream || !video.videoWidth || !video.videoHeight) { reportError('La cámara aún no está lista.'); return; }
      try {
        photo = compressedJpeg(video);
        preview.src = photo; preview.hidden = false; stopCamera();
        capture.hidden = true; retake.hidden = false; send.hidden = false;
        status.className = ''; status.textContent = 'Revisa la foto y toca «Usar esta foto».';
      } catch (error) { reportError(error.message); }
    };
    retake.onclick = () => {
      photo = ''; preview.hidden = true; retake.hidden = true; send.hidden = true;
      start.hidden = false; start.disabled = false; openCamera();
    };
    send.onclick = () => {
      if (!photo || !window.opener || window.opener.closed) { reportError('La aplicación ya no está abierta. Vuelve a iniciar el reporte.'); return; }
      window.opener.postMessage({ type: 'camera-captured', requestId, dataUrl: photo }, targetOrigin);
      status.className = ''; status.textContent = 'Foto enviada a la aplicación. Puedes cerrar esta pestaña.';
      send.disabled = true; setTimeout(() => window.close(), 400);
    };
    window.addEventListener('pagehide', stopCamera);
    if (!requestId || !window.opener || !ALLOWED_PARENT_ORIGINS.includes(targetOrigin)) {
      start.disabled = true; reportError('Esta página debe abrirse desde la aplicación y tener configurado su origen permitido.');
    }
  </script>
</body>
</html>
